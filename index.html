<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Graduation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

canvas{
    display:block;
}

#titleBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:10;
    pointer-events:none;
}

#mainTitle{
    font-size:72px;
    color:#FFD700;
    font-weight:bold;

    text-shadow:
    0 0 10px #FFD700,
    0 0 30px #FFD700,
    0 0 60px #FFD700;
}

#subTitle{
    margin-top:15px;
    color:white;
    font-size:18px;
}

#statusBox{

    position:absolute;

    top:20px;
    left:20px;

    color:white;

    z-index:10;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:20px;

    padding:20px;
}

#musicPlayer{

    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    z-index:20;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:20px;

    padding:15px 30px;

    display:flex;
    align-items:center;
    gap:15px;
}

select,button{

    border:none;
    outline:none;

    background:transparent;

    color:white;

    font-size:16px;

    cursor:pointer;
}

.photo{

    position:absolute;

    width:140px;

    border:8px solid white;

    box-shadow:
    0 10px 30px rgba(0,0,0,.5);

    z-index:8;

    transition:.5s;
}

</style>
</head>


<body>


<div id="titleBox">

    <div id="mainTitle">
        Happy Graduation
    </div>

    <div id="subTitle">
        A special gift from Mr. Huang to Santa Clara Cougars
    </div>

</div>


<div id="statusBox">

    <div id="phaseText">
        Phase: TREE
    </div>

    <div style="margin-top:10px;">
        Click to transform
    </div>

</div>


<div id="musicPlayer">

    ❄️

    <select id="musicSelect">

        <option value="1">听我说谢谢你</option>
        <option value="2">健康过好年</option>
        <option value="3">热爱105度的你</option>
        <option value="4">新年好马</option>

    </select>

    <button onclick="playMusic()">
        ▶ Play
    </button>

    <audio id="audio"></audio>

</div>



<!-- libraries -->

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>



<script>


// ============ Scene ============

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(

    60,

    window.innerWidth / window.innerHeight,

    0.1,

    1000

);

camera.position.z = 18;



const renderer = new THREE.WebGLRenderer({

    antialias:true

});

renderer.setSize(

    window.innerWidth,

    window.innerHeight

);

renderer.setPixelRatio(

    window.devicePixelRatio

);

document.body.appendChild(

    renderer.domElement

);



// ============ Lights ============

const warmLight = new THREE.PointLight(

    0xffddaa,

    150

);

warmLight.position.set(

    5,5,5

);

scene.add(

    warmLight

);


const coolLight = new THREE.PointLight(

    0x66aaff,

    80

);

coolLight.position.set(

    -5,5,-5

);

scene.add(

    coolLight

);




// ============ Stars Background ============

const starGeometry = new THREE.BufferGeometry();

const starPositions = [];

for(let i=0;i<2000;i++){

    starPositions.push(

        (Math.random()-0.5)*200,

        (Math.random()-0.5)*200,

        (Math.random()-0.5)*200

    );

}

starGeometry.setAttribute(

    "position",

    new THREE.Float32BufferAttribute(

        starPositions,

        3

    )

);


const stars = new THREE.Points(

    starGeometry,

    new THREE.PointsMaterial({

        color:0xffffff,

        size:.2

    })

);

scene.add(

    stars

);




// ============ Tree Particles ============

const particleCount = 5000;

const treeGeometry = new THREE.BufferGeometry();

const treePositions = [];

const originalPositions = [];



for(let i=0;i<particleCount;i++){

    const height = Math.random()*8;

    const radius = (1-height/8)*2.5;

    const angle = Math.random()*Math.PI*2;


    const x = Math.cos(angle)*radius;

    const y = height - 4;

    const z = Math.sin(angle)*radius;


    treePositions.push(

        x,y,z

    );


    originalPositions.push(

        x,y,z

    );

}



treeGeometry.setAttribute(

    "position",

    new THREE.Float32BufferAttribute(

        treePositions,

        3

    )

);



const treeMaterial = new THREE.PointsMaterial({

    color:0x00ff88,

    size:.12

});


const tree = new THREE.Points(

    treeGeometry,

    treeMaterial

);

scene.add(

    tree

);



let exploded = false;




// ============ Interaction ============

document.addEventListener(

    "click",

    ()=>{

        if(!exploded){

            explodeTree();

        }

        else{

            restoreTree();

        }

    }

);




function explodeTree(){

    exploded = true;

    document.getElementById(

        "phaseText"

    ).innerHTML = "Phase: NEBULA";


    const positions =

    treeGeometry.attributes.position.array;


    for(let i=0;i<particleCount;i++){

        const angle =

        (i/particleCount)*Math.PI*2;


        gsap.to(

            positions,

            {

                [i*3]:

                Math.cos(angle)*8,


                [i*3+2]:

                Math.sin(angle)*8,


                duration:2,


                onUpdate:()=>{

                    treeGeometry.attributes.position.needsUpdate = true;

                }

            }

        );

    }


    showPhotos();

}




function restoreTree(){

    exploded = false;

    document.getElementById(

        "phaseText"

    ).innerHTML = "Phase: TREE";


    const positions =

    treeGeometry.attributes.position.array;


    for(let i=0;i<particleCount*3;i++){

        gsap.to(

            positions,

            {

                [i]:

                originalPositions[i],

                duration:2,


                onUpdate:()=>{

                    treeGeometry.attributes.position.needsUpdate = true;

                }

            }

        );

    }


    hidePhotos();

}




// ============ Photos ============

function showPhotos(){

    hidePhotos();


    for(let i=1;i<=10;i++){

        const img = document.createElement("img");


        img.src =

        `https://raw.githubusercontent.com/Bingley-A/Santa-Clara-graduation-gift/main/images/photo${i}.jpg`;


        img.className = "photo";

        img.dataset.photo = "yes";


        const angle =

        (i/10)*Math.PI*2;


        const x =

        Math.cos(angle)*300;


        const y =

        Math.sin(angle)*200;


        img.style.left =

        `calc(50% + ${x}px)`;


        img.style.top =

        `calc(50% + ${y}px)`;


        document.body.appendChild(

            img

        );

    }

}



function hidePhotos(){

    document

    .querySelectorAll(

        "[data-photo]"

    )

    .forEach(

        el=>el.remove()

    );

}




// ============ Music ============

function playMusic(){

    const index =

    document.getElementById(

        "musicSelect"

    ).value;


    const audio =

    document.getElementById(

        "audio"

    );


    audio.src =

    `https://raw.githubusercontent.com/Bingley-A/Santa-Clara-graduation-gift/main/music/music${index}.m4a`;


    audio.play();

}




// ============ Animation ============

function animate(){

    requestAnimationFrame(

        animate

    );


    tree.rotation.y += 0.003;

    stars.rotation.y += 0.0008;


    renderer.render(

        scene,

        camera

    );

}


animate();




// ============ Resize ============

window.addEventListener(

    "resize",

    ()=>{

        camera.aspect =

        window.innerWidth /

        window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);


</script>


</body>
</html>
