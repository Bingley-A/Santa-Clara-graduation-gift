<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毕业季特别礼物 - 粒子相册</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { display: block; }
        .glass { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        @keyframes pulse-soft { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
        .animate-pulse-soft { animation: pulse-soft 3s infinite; }
    </style>
</head>
<body>

    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-6">
        <div class="flex justify-between items-start">
            <div class="glass p-3 rounded-2xl pointer-events-auto w-44 shadow-2xl">
                <div class="relative aspect-video bg-black/40 rounded-lg overflow-hidden mb-2 border border-white/10">
                    <video id="webcam" autoplay playsinline class="w-full h-full object-cover" style="transform: scaleX(-1);"></video>
                    <div id="cam-off" class="absolute inset-0 flex items-center justify-center text-[10px] text-white/30">摄像头未开启</div>
                </div>
                <button id="toggle-cam" class="w-full py-1.5 rounded-lg text-[10px] font-bold bg-white/10 hover:bg-white/20 transition-all">开启手势识别</button>
                <div id="gesture-text" class="mt-2 text-[10px] text-cyan-400 text-center font-mono tracking-widest">---</div>
            </div>

            <div class="text-right">
                <h1 class="text-4xl md:text-5xl font-bold tracking-tighter">GRADUATION 2024</h1>
                <p class="text-white/40 text-xs mt-1 tracking-[0.2em]">给小朋友们的毕业特别礼物</p>
            </div>
        </div>

        <div id="hint-text" class="text-center text-white/40 text-sm animate-pulse-soft tracking-widest">
            点击下方播放音乐开始体验
        </div>

        <div class="flex justify-center">
            <div id="music-btn" class="glass px-8 py-4 rounded-full pointer-events-auto cursor-pointer flex items-center gap-4 transition-all hover:scale-105 active:scale-95">
                <div id="music-icon" class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-600 to-blue-400 flex items-center justify-center text-xl">🎵</div>
                <div class="flex flex-col">
                    <span class="text-sm font-semibold">听我说谢谢你</span>
                    <span id="music-status" class="text-[10px] text-white/40 uppercase tracking-widest">点击播放</span>
                </div>
            </div>
        </div>
    </div>

    <audio id="bg-music" src="music.m4a" loop></audio>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 状态变量
        let phase = 'photo'; // photo, blooming, nebula, collapsing
        let isMusicPlaying = false;
        let particles, material;
        const clock = new THREE.Clock();

        // 1. 初始化场景
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 20;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;

        // 2. 创建粒子系统
        async function initParticles() {
            const textureLoader = new THREE.TextureLoader();
            const img = new Image();
            img.src = 'photo.jpg';
            
            await new Promise(resolve => img.onload = resolve);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 120;
            canvas.width = size;
            canvas.height = Math.floor(size * (img.height / img.width));
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            const positions = [];
            const colors = [];
            const targets = [];

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const i = (y * canvas.width + x) * 4;
                    if (pixels[i + 3] > 128) {
                        // 原始照片位置
                        positions.push((x - canvas.width / 2) * 0.12, -(y - canvas.height / 2) * 0.12, 0);
                        // 颜色
                        colors.push(pixels[i] / 255, pixels[i + 1] / 255, pixels[i + 2] / 255);
                        // 爆炸目标位置
                        const r = 10 + Math.random() * 10;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        targets.push(
                            r * Math.sin(phi) * Math.cos(theta),
                            r * Math.sin(phi) * Math.sin(theta) * 0.6,
                            r * Math.cos(phi)
                        );
                    }
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('target', new THREE.Float32BufferAttribute(targets, 3));

            material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uProgress: { value: 0 }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform float uProgress;
                    attribute vec3 target;
                    attribute vec3 color;
                    varying vec3 vColor;
                    void main() {
                        vColor = color;
                        vec3 pos = mix(position, target, uProgress);
                        pos.y += sin(uTime + position.x) * 0.1 * uProgress;
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = 4.0 * (20.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    void main() {
                        if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
                        gl_FragColor = vec4(vColor, 1.0);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        initParticles();

        // 3. 动画循环
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if (material) material.uniforms.uTime.value = t;
            
            // 状态平滑过渡
            if (material) {
                const targetProgress = (phase === 'blooming' || phase === 'nebula') ? 1 : 0;
                material.uniforms.uProgress.value += (targetProgress - material.uniforms.uProgress.value) * 0.05;
            }

            if (particles && phase === 'nebula') {
                particles.rotation.y += 0.002;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 4. 音乐与手势交互
        const musicBtn = document.getElementById('music-btn');
        const audio = document.getElementById('bg-music');
        const musicStatus = document.getElementById('music-status');
        const musicIcon = document.getElementById('music-icon');

        musicBtn.onclick = () => {
            isMusicPlaying = !isMusicPlaying;
            if (isMusicPlaying) {
                audio.play();
                musicStatus.innerText = '正在播放';
                musicIcon.classList.add('animate-spin');
            } else {
                audio.pause();
                musicStatus.innerText = '已暂停';
                musicIcon.classList.remove('animate-spin');
            }
        };

        // 5. 手势识别集成
        const video = document.getElementById('webcam');
        const toggleCamBtn = document.getElementById('toggle-cam');
        const gestureText = document.getElementById('gesture-text');
        let handLandmarker;

        async function initHandTracking() {
            const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm');
            const fileset = await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await vision.HandLandmarker.createFromOptions(fileset, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
                runningMode: "VIDEO", numHands: 1
            });
        }

        toggleCamBtn.onclick = async () => {
            if (!handLandmarker) {
                toggleCamBtn.innerText = '加载模型中...';
                await initHandTracking();
            }
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            document.getElementById('cam-off').classList.add('hidden');
            toggleCamBtn.innerText = '识别中';
            detectHands();
        };

        function detectHands() {
            if (handLandmarker && video.readyState >= 2) {
                const results = handLandmarker.detectForVideo(video, performance.now());
                if (results.landmarks && results.landmarks.length > 0) {
                    const l = results.landmarks;
                    // 简单判断：指尖高于关节为张开
                    const isOpen = l.y < l.y && l.y < l.y;
                    const isFist = l.y > l.y && l.y > l.y;

                    if (isOpen && phase === 'photo') {
                        phase = 'blooming';
                        gestureText.innerText = '👋 张开';
                        setTimeout(() => phase = 'nebula', 2000);
                    } else if (isFist && phase === 'nebula') {
                        phase = 'collapsing';
                        gestureText.innerText = '✊ 握拳';
                        setTimeout(() => phase = 'photo', 2000);
                    }
                }
            }
            requestAnimationFrame(detectHands);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
