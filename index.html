<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Happy Graduation</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script src="https://unpkg.com/@react-three/fiber/dist/react-three-fiber.umd.js"></script>
<script src="https://unpkg.com/@react-three/drei/index.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
display:block;
}

.title{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
pointer-events:none;
text-align:center;
z-index:5;
}

.main-title{
font-size:72px;
font-weight:bold;
color:#FFD700;
text-shadow:
0 0 20px gold,
0 0 40px gold;
}

.sub-title{
margin-top:10px;
color:white;
font-size:18px;
opacity:.9;
}

.status{
position:absolute;
left:20px;
top:20px;
z-index:10;
color:white;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);

padding:20px;
border-radius:20px;
}

.player{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
z-index:10;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);

padding:20px;
border-radius:30px;

display:flex;
gap:10px;
align-items:center;
}

select{
background:transparent;
color:white;
border:none;
outline:none;
}

button{
cursor:pointer;
}

.photo{
position:absolute;
border:8px solid white;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

</style>

</head>

<body>

<div class="title">

<div class="main-title">
Happy Graduation
</div>

<div class="sub-title">
A special gift from Mr. Huang to Santa Clara Cougars
</div>

</div>


<div class="status">

<div id="phaseText">Phase: TREE</div>

<div style="margin-top:10px;">
Gesture:
<span id="gestureText">
Waiting...
</span>
</div>

</div>


<div class="player">

❄️

<select id="musicSelect">

<option value="1">听我说谢谢你</option>
<option value="2">健康过好年</option>
<option value="3">热爱105度的你</option>
<option value="4">新年好马</option>

</select>

<button onclick="playMusic()">
▶ PLAY
</button>

<audio id="audio"></audio>

</div>



<script>

const {
Canvas,
useFrame
} = ReactThreeFiber;

const {
Stars,
Sparkles,
OrbitControls
} = drei;



const PHOTOS = [];

for(let i=1;i<=10;i++){

PHOTOS.push(
`https://raw.githubusercontent.com/Bingley-A/Santa-Clara-graduation-gift/main/images/photo${i}.jpg`
);

}


function randomTreePosition(){

const h = Math.random()*8;

const radius = (1-h/8)*2;

const angle = Math.random()*Math.PI*2;

return new THREE.Vector3(

Math.cos(angle)*radius,
h-4,
Math.sin(angle)*radius

);

}



function ParticleTree(){

const meshRef = React.useRef();

const [phase,setPhase] = React.useState("tree");

const dummy = new THREE.Object3D();

const positions = React.useMemo(()=>{

const arr=[];

for(let i=0;i<5000;i++){

arr.push(randomTreePosition());

}

return arr;

},[]);



React.useEffect(()=>{

let timeout;

function trigger(){

if(phase==="tree"){

setPhase("blooming");

document.getElementById("phaseText").innerHTML="Phase: BLOOMING";

timeout=setTimeout(()=>{

setPhase("nebula");

document.getElementById("phaseText").innerHTML="Phase: NEBULA";

showPhotos();

},2000);

}

else if(phase==="nebula"){

hidePhotos();

setPhase("tree");

document.getElementById("phaseText").innerHTML="Phase: TREE";

}

}

window.addEventListener("click",trigger);

return ()=>{

window.removeEventListener("click",trigger);

clearTimeout(timeout);

}

},[phase]);


useFrame((state)=>{

if(!meshRef.current) return;

for(let i=0;i<positions.length;i++){

let p=positions[i];

let x=p.x;
let y=p.y;
let z=p.z;

if(phase==="blooming"||phase==="nebula"){

const angle=(i/positions.length)*Math.PI*2;

x=Math.cos(angle)*8;
z=Math.sin(angle)*8;

}

dummy.position.set(x,y,z);

dummy.scale.set(.08,.08,.08);

dummy.updateMatrix();

meshRef.current.setMatrixAt(i,dummy.matrix);

}

meshRef.current.instanceMatrix.needsUpdate=true;

});


return(

React.createElement(

"instancedMesh",

{

ref:meshRef,

args:[null,null,5000]

},

React.createElement("sphereGeometry",[.1,6,6]),

React.createElement(

"meshStandardMaterial",

{
color:"#00ff88",
emissive:"#00ff88",
emissiveIntensity:.5
}

)

)

);

}



function Scene(){

return(

React.createElement(

React.Fragment,

null,

React.createElement("ambientLight",{intensity:1}),

React.createElement("pointLight",{

position:[5,5,5],
color:"#FFDDAA",
intensity:20

}),

React.createElement("pointLight",{

position:[-5,5,-5],
color:"#66AAFF",
intensity:10

}),


React.createElement(Stars,{
radius:100
}),


React.createElement(Sparkles,{
count:300
}),


React.createElement(ParticleTree),

React.createElement(OrbitControls)

)

);

}



function App(){

return(

React.createElement(

Canvas,

{

camera:{
position:[0,0,18]
}

},

React.createElement(Scene)

)

);

}



ReactDOM.createRoot(
document.body.appendChild(document.createElement("div"))
).render(

React.createElement(App)

);



function showPhotos(){

hidePhotos();

for(let i=0;i<10;i++){

const img=document.createElement("img");

img.src=PHOTOS[i];

img.className="photo";

const angle=(i/10)*Math.PI*2;

const x=Math.cos(angle)*300;
const y=Math.sin(angle)*200;

img.style.left=`calc(50% + ${x}px)`;
img.style.top=`calc(50% + ${y}px)`;

img.style.width="140px";

img.dataset.photo="yes";

document.body.appendChild(img);

}

}



function hidePhotos(){

document.querySelectorAll("[data-photo]").forEach(

el=>el.remove()

);

}



function playMusic(){

const audio=document.getElementById("audio");

const v=document.getElementById("musicSelect").value;

audio.src=

`https://raw.githubusercontent.com/Bingley-A/Santa-Clara-graduation-gift/main/music/music${v}.m4a`;

audio.play();

}



</script>

</body>
</html>
